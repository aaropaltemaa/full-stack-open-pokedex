name: Health Check

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  check_url:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed app health
        uses: Jtalk/url-health-check-action@v3
        with:
          url: https://full-stack-open-pokedex-40ps.onrender.com
          follow-redirect: true
          max-attempts: 3
          retry-delay: 10s     
