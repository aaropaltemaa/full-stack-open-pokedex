name: Health Check

on:
  workflow_dispatch:

jobs:
  check_url:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed app health
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://full-stack-open-pokedex-40ps.onrender.com
          max-attempts: 3
          retry-delay: 5s     
